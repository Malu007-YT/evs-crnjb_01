name: Shadow Engine (EV Scanner AI Research Lab)
#on:  
  schedule:
    # Ogni 15 minuti - Shadow Engine Python
    - cron: '*/15 * * * *'  
  workflow_dispatch: {}

# Evita esecuzioni parallele: se un run è in corso, il successivo aspetta
concurrency:
  group: shadow-engine
  cancel-in-progress: false

jobs:
  run-shadow-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ev_scanner_shadow_lab/main/requirements.txt

      - name: Installa dipendenze Python
        working-directory: ev_scanner_shadow_lab/main
        run: pip install -r requirements.txt

      - name: Esegui ciclo Shadow Engine
        working-directory: ev_scanner_shadow_lab/main
        env:
          # URL completo dell'endpoint resolve_bets_web.php su InfinityFree
          SHADOW_API_URL: ${{ secrets.SHADOW_API_URL }}
          # Bearer Token per autenticazione
          SHADOW_API_TOKEN: ${{ secrets.SHADOW_API_TOKEN }}
        run: python3 main_shadow_engine.py

      - name: Riassunto esecuzione
        if: always()
        run: |
          echo "### Shadow Engine - Riepilogo esecuzione" >> $GITHUB_STEP_SUMMARY
          echo "Vedi lo step precedente per la diagnosi completa fase-per-fase." >> $GITHUB_STEP_SUMMARY
          echo "Log persistente anche in \`shadow_run_log\` (tabella DB)." >> $GITHUB_STEP_SUMMARY
