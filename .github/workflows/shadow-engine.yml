name: EV Scanner - Trigger & Shadow Engine

on:
  schedule:
    - cron: '*/20 * * * *'    # Trigger worker ogni 20 min
    - cron: '*/15 * * * *'    # Shadow Engine ogni 15 min
  workflow_dispatch: {}

# Evita esecuzioni parallele dello stesso job
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------
  # JOB 1: Trigger Worker PHP (Playwright) - ogni 20 min
  # ------------------------------------------------------------
  trigger-worker:
    if: github.event.schedule == '*/20 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installa dipendenze
        run: npm ci

      - name: Installa Chromium per Playwright
        run: npx playwright install --with-deps chromium

      - name: Esegui trigger worker
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          SCAN_URL: ${{ secrets.SCAN_URL }}
        run: node trigger.js

  # ------------------------------------------------------------
  # JOB 2: Shadow Engine Python - ogni 15 min
  # ------------------------------------------------------------
  shadow-engine:
    if: github.event.schedule == '*/15 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Evita sovrapposizioni: se un run è in corso, il successivo aspetta
    concurrency:
      group: shadow-engine
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: Ev-scanner-cronjob-main/ev_scanner_shadow_lab/main/requirements.txt

      - name: Installa dipendenze Python
        working-directory: Ev-scanner-cronjob-main/ev_scanner_shadow_lab/main
        run: pip install -r requirements.txt

      - name: Esegui ciclo Shadow Engine
        working-directory: Ev-scanner-cronjob-main/ev_scanner_shadow_lab/main
        env:
          # URL completo dell'endpoint resolve_bets_web.php su InfinityFree
          # Esempio: https://tuodominio.infinityfreeapp.com/worker/resolve_bets_web.php
          SHADOW_API_URL: ${{ secrets.SHADOW_API_URL }}

          # Bearer Token per autenticazione (deve coincidere con WORKER_SECRET_TOKEN in config/config.php)
          SHADOW_API_TOKEN: ${{ secrets.SHADOW_API_TOKEN }}

          # Opzionali (default: timeout 30s, max 3 retry)
          # SHADOW_TIMEOUT_SECONDS: 30
          # SHADOW_MAX_RETRIES: 3
        run: python3 main_shadow_engine.py

      - name: Riassunto esecuzione
        if: always()
        run: |
          echo "### Shadow Engine - Riepilogo esecuzione" >> $GITHUB_STEP_SUMMARY
          echo "Vedi lo step precedente per la diagnosi completa fase-per-fase." >> $GITHUB_STEP_SUMMARY
          echo "Log persistente anche in \`shadow_run_log\` (tabella DB)." >> $GITHUB_STEP_SUMMARY
