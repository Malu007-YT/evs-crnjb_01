name: Ponte Forebet

# PERCHE' ESISTE QUESTO WORKFLOW
# Forebet risponde HTTP 403 a qualunque richiesta partita da InfinityFree:
# l'IP condiviso di byetcluster e' filtrato dal loro WAF. Nei log del server si
# vede il fallimento istantaneo su entrambe le URL. Questo runner ha internet
# libero, quindi scarica lui le pagine e le spedisce al PHP, che le interpreta
# e le salva. Vedi forebet.js per il flusso e l'action forebet_ingest lato PHP.

on:
  schedule:
    # UNA VOLTA AL GIORNO, alle 06:10 UTC (08:10 in Italia).
    #
    # Non di piu', per due motivi. Primo: Forebet ricalcola i suoi pronostici
    # poche volte al giorno, quindi scaricare piu' spesso restituirebbe gli
    # stessi identici numeri. Secondo, e piu' importante: serve la probabilita'
    # PRE-partita, e la mattina presto quasi tutte le partite del giorno devono
    # ancora iniziare. Piu' tardi si scarica, piu' righe vengono correttamente
    # rifiutate dalla guardia anti-leakage.
    #
    # NOTE SUL CRON DI GITHUB: le run schedulate possono partire in ritardo
    # (anche 5-30 minuti) quando l'infrastruttura e' carica; GitHub disabilita
    # in automatico i workflow schedulati dopo 60 giorni senza commit sul
    # branch di default.
    # Due volte al giorno: con i proxy pubblici il successo e' probabilistico,
    # quindi un secondo tentativo raddoppia le probabilita' senza costare nulla.
    # Restano entrambi in mattinata/primo pomeriggio perche' serve la
    # probabilita' PRE-partita: piu' tardi si scarica, piu' righe vengono
    # correttamente rifiutate dalla guardia anti-leakage.
    - cron: '10 6,11 * * *'
  workflow_dispatch: {}

jobs:
  forebet:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # MEMORIA DEI PROXY fra una run e l'altra. E' l'ottimizzazione che conta
      # di piu': un IP che ieri ha superato il WAF di Forebet quasi sempre lo
      # supera anche oggi, e senza cache quell'informazione andrebbe persa a
      # ogni run, ricominciando la ricerca da zero ogni mattina.
      # La key cambia a ogni run (cosi' la cache viene RISCRITTA, non solo
      # letta); restore-keys ripesca la piu' recente disponibile.
      - name: Ripristina memoria proxy
        uses: actions/cache@v4
        with:
          path: .proxy-cache
          key: forebet-proxy-${{ github.run_id }}
          restore-keys: forebet-proxy-

      - name: Installa dipendenze
        run: npm install

      - name: Installa Chromium per Playwright
        # Serve due volte: per superare il WAF di Forebet, e per superare la
        # JS-challenge di InfinityFree quando si rispedisce l'HTML al nostro PHP.
        run: npx playwright install --with-deps chromium

      - name: Esegui il ponte
        env:
          FOREBET_INGEST_URL: ${{ secrets.FOREBET_INGEST_URL }}
          FOREBET_GIORNI: '2'
          # Quanti proxy provare per pagina prima di arrendersi. Alzalo se nei
          # log vedi soprattutto proxy morti; NON serve alzarlo se vedi
          # soprattutto 403 (in quel caso il problema e' un altro, vedi la
          # diagnosi che lo script stampa da solo).
          FOREBET_MAX_PROXY: '300'
          # Scadenza INTERNA della ricerca proxy. Deve restare comodamente
          # sotto timeout-minutes: se e' GitHub a tagliare il job, il processo
          # muore senza salvare la memoria dei proxy e la run successiva
          # riparte da zero — che e' esattamente quello che era successo.
          FOREBET_SCADENZA_MIN: '6'
        run: node forebet.js
