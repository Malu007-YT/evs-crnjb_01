const { chromium } = require('playwright-extra');
const stealth = require('puppeteer-extra-plugin-stealth')();

// Applica il plugin stealth per rimuovere le tracce di automazione (navigator.webdriver, ecc.)
chromium.use(stealth);

async function runTrigger(url, name) {
    console.log(`[${name}] Avvio richiesta stealth...`);
    
    // Configurazione avanzata del browser per emulare un utente reale su Windows
    const browser = await chromium.launch({ 
        headless: true,
        args: [
            '--disable-blink-features=AutomationControlled', // Nasconde il controllo automazione
            '--disable-infobars',
            '--no-sandbox',
            '--window-size=1920,1080'
        ]
    });

    // Configura un contesto con impronta digitale umana
    const context = await browser.newContext({
        userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36',
        viewport: { width: 1920, height: 1080 },
        locale: 'it-IT',
        timezoneId: 'Europe/Rome',
        extraHTTPHeaders: {
            'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8',
            'Accept-Language': 'it-IT,it;q=0.9,en-US;q=0.8,en;q=0.7',
            'Cache-Control': 'max-age=0',
            'Upgrade-Insecure-Requests': '1'
        }
    });

    const page = await context.newPage();

    try {
        // Naviga verso l'URL simulando un'attesa normale
        const response = await page.goto(url, { 
            waitUntil: 'networkidle', // Attende che la sfida JS / slowAES sia completata e la rete sia stabile
            timeout: 60000 
        });

        // Piccolo trucco: muovi leggermente il mouse o scrolla per attivare eventuali listener di comportamento umano
        await page.mouse.move(100, 100);
        await page.waitForTimeout(3000); // Pausa di 3 secondi per dare tempo al cookie di stabilizzarsi

        // Estrai il contenuto per verificare se ha risposto il JSON o se siamo ancora bloccati
        const content = await page.textContent('body');
        console.log(`[${name}] Status codice: ${response.status()}`);
        console.log(`[${name}] Risposta del server:\n`, content.trim());

        if (!content.includes('"success":true') && !content.includes('success')) {
            throw new Error(`Rilevato potenziale blocco anti-bot o risposta non valida.`);
        }

    } catch (error) {
        console.error(`[${name}] Errore durante l'esecuzione:`, error.message);
        // Cattura uno screenshot per fare debug nei log di GitHub in caso di fallimento
        await page.screenshot({ path: `failure-${name}.png` });
        throw error;
    } finally {
        await browser.close();
    }
}

async function main() {
    const scanUrl = process.env.SCAN_URL;
    const workerUrl = process.env.WORKER_URL;

    if (!scanUrl || !workerUrl) {
        console.error("Errore: SCAN_URL o WORKER_URL non configurati nei Secrets di GitHub.");
        process.exit(1);
    }

    try {
        // 1. Esegue lo scanner
        await runTrigger(scanUrl, "SCANNER");
        
        // Attesa precauzionale tra un endpoint e l'altro
        console.log("Attesa di 5 secondi prima del prossimo worker...");
        await new Promise(resolve => setTimeout(resolve, 5000));
        
        // 2. Esegue la risoluzione esiti
        await runTrigger(workerUrl, "RESOLVER");
        
        console.log("Tutti i trigger completati con successo.");
    } catch (e) {
        console.error("Il workflow è fallito in uno dei passaggi.");
        process.exit(1);
    }
}

main();
