name: Trigger EV Scanner worker

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installa dipendenze
        run: npm install

      - name: Installa Chromium per Playwright
        run: npx playwright install --with-deps chromium

      - name: Esegui il trigger dei worker
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          SCAN_URL: ${{ secrets.SCAN_URL }}
        run: node trigger.js
