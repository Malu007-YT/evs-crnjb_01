name: Trigger EV Scanner worker

# Perché questo workflow esiste:
# L'hosting gratuito (free.je, stesso ecosistema di InfinityFree) protegge
# TUTTE le richieste esterne con una JS-challenge anti-bot (slowAES): un
# semplice HTTP GET (cron-job.org, curl, wget, UptimeRobot...) riceve solo
# una paginetta con JavaScript da eseguire, mai lo script PHP vero. Serve
# quindi un browser reale che esegua quel JavaScript — Playwright headless
# (Chromium) lo fa, GRATIS, dentro GitHub Actions.
#
# Richiama in sequenza DUE endpoint (vedi trigger.js):
#   1) lo scanner (worker/scan_web.php) — prima girava lato client nel
#      browser dell'utente quando risultava "scaduto", causando lag durante
#      la navigazione: ora gira solo qui, in background.
#   2) la risoluzione esiti + CLV (worker/resolve_bets_web.php).
#
# SETUP RICHIESTO (una tantum):
#  1) Crea un repository GitHub (anche privato) e carica questa cartella
#     cosi' com'e' (.github/workflows/trigger-worker.yml + trigger.js +
#     package.json).
#  2) Settings del repo -> Secrets and variables -> Actions -> New repository
#     secret, DUE volte:
#        Nome: WORKER_URL
#        Valore: http://evscanner.free.je/ev-scanner/worker/resolve_bets_web.php?token=IL_TUO_TOKEN
#        Nome: SCAN_URL
#        Valore: http://evscanner.free.je/ev-scanner/worker/scan_web.php?token=IL_TUO_TOKEN
#     (stesso token per entrambi, e' lo stesso WORKER_SECRET_TOKEN in
#     config/config.php — il token NON va mai scritto nel file YAML, solo
#     nei Secrets di GitHub.)
#  3) Fatto. Il workflow parte da solo secondo lo schedule sotto. Puoi anche
#     lanciarlo a mano da Actions -> Trigger EV Scanner worker -> Run workflow
#     per testarlo subito senza aspettare.
#
# FREQUENZA: ogni 20 minuti (era 15 — allungata di proposito per consumare
# meno budget richieste di odds-api.io/API-Sports nell'arco della giornata,
# mantenendo comunque una cadenza piu' che sufficiente per non perdere
# occasioni di value bet ne' la finestra di cattura CLV di 3 ore).
#
# NOTA sui tempi: GitHub Actions su runner pubblici NON garantisce che uno
# schedule "*/20" parta esattamente ogni 20 minuti — in certi momenti di
# carico puo' slittare di qualche minuto. Va benissimo per questo caso
# d'uso: qualche minuto di ritardo occasionale non cambia nulla nella
# pratica.

on:
  schedule:
    - cron: '*/20 * * * *' # ogni 20 minuti
  workflow_dispatch: {} # permette anche l'avvio manuale da GitHub, utile per testare subito

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5 # scan + resolve insieme richiedono un po' piu' di margine di prima (un solo endpoint)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installa dipendenze
        run: npm install

      - name: Installa Chromium per Playwright
        run: npx playwright install --with-deps chromium

      - name: Esegui il trigger dei worker
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          SCAN_URL: ${{ secrets.SCAN_URL }}
        run: node trigger.js